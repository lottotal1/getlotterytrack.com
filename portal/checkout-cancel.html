<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Cancelled — Lottery Track Portal</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <style>
    .page-wrap {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .result-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 56px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .result-icon {
      width: 72px;
      height: 72px;
      background: var(--light-gray);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto 24px;
    }
    .result-card h1 {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .result-card p {
      font-size: 16px;
      color: #556070;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (max-width: 480px) {
      .result-card { padding: 40px 24px; }
    }
  </style>
</head>
<body>

  <nav class="site-nav" id="site-nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Lottery <span>Track</span></a>
      <div class="nav-links">
        <a href="dashboard.html" style="color:var(--light);text-decoration:none;font-size:14px;font-weight:500;padding:8px 12px;border-radius:6px;transition:background 0.2s" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='transparent'">My Stores</a>
      </div>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="result-card">
      <div class="result-icon">←</div>
      <h1>Checkout Cancelled</h1>
      <p>No charge was made. You can try again whenever you're ready.</p>

      <div class="action-stack">
        <a href="add-store.html" class="btn-primary">Try Again</a>
        <a href="dashboard.html" class="btn-secondary">Back to My Stores</a>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('scroll', () => {
      document.getElementById('site-nav').classList.toggle('scrolled', window.scrollY > 0);
    });
  </script>

</body>
</html>
