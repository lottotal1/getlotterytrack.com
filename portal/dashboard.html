<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Stores — Lottery Track Portal</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <style>
    .portal-hero {
      background: var(--navy);
      padding: 40px 0 36px;
    }
    .portal-hero-inner {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .portal-hero h1 {
      font-family: var(--font-serif);
      font-size: 30px;
      font-weight: 700;
      color: white;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .portal-hero-sub {
      font-size: 15px;
      color: var(--light);
    }
    .portal-content { padding: 40px 0 80px; }
    .stores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 0;
    }

    /* Store card */
    .store-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s, border-color 0.2s;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .store-card:hover {
      box-shadow: var(--shadow-hover);
      border-color: var(--green);
    }
    .store-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .store-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.3;
    }
    .role-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #778899;
      background: var(--light-gray);
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .store-addr {
      font-size: 13px;
      color: #778899;
      margin-top: 3px;
      line-height: 1.4;
    }
    .status-badge {
      flex-shrink: 0;
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 10px;
      white-space: nowrap;
    }
    .s-active   { background: #E8F5EE; color: #1A5C3A; }
    .s-trialing { background: #EFF6FF; color: #1D4ED8; }
    .s-past_due { background: #FFF5F5; color: #B91C1C; }
    .s-canceled { background: var(--light-gray); color: #556070; }
    .s-inactive { background: var(--light-gray); color: #556070; }

    .store-meta {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .meta-label { color: #778899; }
    .meta-value { color: var(--navy); font-weight: 600; }
    .provider-apple { color: #555; }
    .provider-stripe { color: var(--green); }

    /* Add store card */
    .add-card {
      background: var(--light-gray);
      border-radius: var(--radius-lg);
      border: 2px dashed #C8D8E4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      min-height: 180px;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
      padding: 24px;
    }
    .add-card:hover {
      border-color: var(--green);
      background: #EEF9F4;
    }
    .add-icon {
      width: 44px;
      height: 44px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: var(--shadow);
      color: var(--green);
      font-weight: 700;
    }
    .add-title { font-size: 15px; font-weight: 700; color: var(--navy); }
    .add-sub   { font-size: 13px; color: #778899; }

    /* Nav extras */
    .nav-user-area { display: flex; align-items: center; gap: 10px; }
    .nav-user-email { font-size: 13px; color: var(--light); }
    .btn-signout {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--light);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.2s;
    }
    .btn-signout:hover { background: rgba(255,255,255,0.1); color: white; }

    /* Empty / loading */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 56px 0;
    }
    .state-msg h3 { font-size: 20px; color: var(--navy); margin-bottom: 8px; }
    .state-msg p  { color: #778899; font-size: 15px; }

    @media (max-width: 680px) {
      .portal-hero-inner { flex-direction: column; align-items: flex-start; gap: 16px; }
      .stores-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="site-nav" id="site-nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Lottery <span>Track</span></a>
      <div class="nav-user-area">
        <span class="nav-user-email" id="nav-email"></span>
        <button class="btn-signout" id="signout-btn">Sign Out</button>
      </div>
    </div>
  </nav>

  <div class="portal-hero">
    <div class="portal-hero-inner">
      <div>
        <h1>My Stores</h1>
        <p class="portal-hero-sub" id="store-count">Loading…</p>
      </div>
      <a href="add-store.html" class="btn-primary" id="add-btn" style="display:none">+ Add Store</a>
    </div>
  </div>

  <div class="portal-content">
    <div class="container">
      <div class="stores-grid" id="stores-grid">
        <div class="state-msg"><p>Loading your stores…</p></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const { createClient } = window.supabase;
    const db = createClient(
      'https://fnnuakksfrurmjcjikib.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZubnVha2tzZnJ1cm1qY2ppa2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2Nzc4MzEsImV4cCI6MjA4ODI1MzgzMX0.qSxliArHcEEuHVShVvpskPNybewfuCaRm0VpshiN8Ps'
    );

    const STATE_NAMES = { NY: 'New York', TX: 'Texas' };

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function statusBadge(status) {
      const map = {
        active:   ['Active',      's-active'],
        trialing: ['Free Trial',  's-trialing'],
        past_due: ['Payment Due', 's-past_due'],
        canceled: ['Cancelled',   's-canceled'],
      };
      const [label, cls] = map[status] || ['Inactive', 's-inactive'];
      return `<span class="status-badge ${cls}">${label}</span>`;
    }

    function fmtDate(iso) {
      if (!iso) return null;
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderCard(store, role) {
      // store_subscriptions has a UNIQUE(store_id) constraint, so PostgREST
      // embeds it as a single object (or null), never an array.
      const sub = store.store_subscriptions || {};
      const provider = sub.payment_provider;
      const renewLabel = sub.status === 'trialing' ? 'Trial ends' : 'Renews';
      const providerLabel = provider === 'apple'
        ? '<span class="provider-apple">🍎 App Store</span>'
        : provider === 'stripe'
        ? '<span class="provider-stripe">💳 Stripe</span>'
        : provider === 'manual' ? '<span style="color:#778899">Manual</span>'
        : '<span style="color:#778899">—</span>';
      const roleTag = role !== 'owner' ? `<span class="role-tag">${esc(role)}</span>` : '';

      const isTrialing = sub.status === 'trialing';
      const cardTag    = isTrialing ? 'div' : 'a';
      const cardHref   = isTrialing ? '' : `href="store.html?id=${esc(store.id)}"`;
      const cardData   = isTrialing ? `data-href="store.html?id=${esc(store.id)}"` : '';

      return `
        <${cardTag} class="store-card" ${cardHref} ${cardData}>
          <div class="store-card-top">
            <div>
              <div class="store-name">${esc(store.name)}${roleTag}</div>
              <div class="store-addr">${esc(store.address || STATE_NAMES[store.state] || store.state)}</div>
            </div>
            ${statusBadge(sub.status)}
          </div>
          <div class="store-meta">
            <div class="meta-row">
              <span class="meta-label">State</span>
              <span class="meta-value">${STATE_NAMES[store.state] || store.state}</span>
            </div>
            ${sub.current_period_end ? `
            <div class="meta-row">
              <span class="meta-label">${renewLabel}</span>
              <span class="meta-value">${fmtDate(sub.current_period_end)}</span>
            </div>` : ''}
            <div class="meta-row">
              <span class="meta-label">Billing</span>
              <span class="meta-value">${providerLabel}</span>
            </div>
            <div class="meta-row" style="margin-top:6px;padding-top:10px;border-top:1px solid var(--border)">
              <a href="store.html?id=${esc(store.id)}" style="font-size:13px;color:var(--green);font-weight:600;text-decoration:none">View reports →</a>
            </div>
            ${isTrialing ? `
            <div class="meta-row" style="margin-top:4px">
              <a href="upgrade.html?id=${esc(store.id)}" style="font-size:13px;color:#D97706;font-weight:600;text-decoration:none">Upgrade to Paid →</a>
            </div>` : ''}
          </div>
        </${cardTag}>
      `;
    }

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.replace('index.html'); return; }

      const user = session.user;
      document.getElementById('nav-email').textContent = user.email;
      document.getElementById('signout-btn').addEventListener('click', async () => {
        await db.auth.signOut();
        window.location.replace('index.html');
      });

      // No .eq('admin_id', ...) here on purpose — RLS returns every store this
      // user can see (owned outright, or granted via store_access as admin/viewer).
      const [{ data: stores, error }, { data: accessRows }] = await Promise.all([
        db
          .from('stores')
          .select('id, name, address, state, store_subscriptions(status, payment_provider, current_period_end)')
          .order('created_at'),
        db
          .from('store_access')
          .select('store_id, role')
          .eq('user_id', user.id),
      ]);

      const roleByStore = new Map((accessRows || []).map(r => [r.store_id, r.role]));

      const grid = document.getElementById('stores-grid');

      if (error || !stores || stores.length === 0) {
        document.getElementById('store-count').textContent = 'No stores yet';
        grid.innerHTML = `
          <div class="state-msg">
            <h3>No stores yet</h3>
            <p style="margin-bottom:24px">Add your first store to get started.</p>
            <a href="add-store.html" class="btn-primary">Add Your First Store</a>
          </div>`;
        return;
      }

      const n = stores.length;
      document.getElementById('store-count').textContent = `${n} store${n !== 1 ? 's' : ''} you have access to`;
      document.getElementById('add-btn').style.display = '';

      grid.innerHTML = stores.map(s => renderCard(s, roleByStore.get(s.id) || 'owner')).join('') + `
        <a href="add-store.html" class="add-card">
          <div class="add-icon">+</div>
          <div class="add-title">Add Another Store</div>
          <div class="add-sub">Subscribe a new location via Stripe</div>
        </a>`;

      // Trialing cards are <div>s — route card-level clicks to store.html,
      // but let nested <a> links (reports / upgrade) handle themselves
      document.querySelectorAll('.store-card[data-href]').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          window.location.href = card.dataset.href;
        });
      });
    }

    init();

    window.addEventListener('scroll', () => {
      document.getElementById('site-nav').classList.toggle('scrolled', window.scrollY > 0);
    });
  </script>

</body>
</html>
