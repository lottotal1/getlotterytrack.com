<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Stores — Lottery Track Portal</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <style>
    .nav-user-area { display: flex; align-items: center; gap: 10px; }
    .nav-user-email { font-size: 13px; color: var(--light); }
    .btn-signout {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--light);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.2s;
    }
    .btn-signout:hover { background: rgba(255,255,255,0.1); color: white; }

    .portal-content { padding: 40px 0 80px; }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
    }
    .page-title {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.4px;
    }
    .page-count { font-size: 14px; color: #778899; margin-top: 5px; }
    .btn-add {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--green);
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .btn-add:hover { background: #235f44; }

    /* ── Store list ── */
    .store-list { display: flex; flex-direction: column; gap: 8px; }

    .list-section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #778899;
      padding: 18px 4px 8px;
    }
    .list-section-label:first-child { padding-top: 0; }

    /* Row card */
    .store-row {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      overflow: hidden;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--navy);
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .store-row:hover { box-shadow: var(--shadow-hover); border-color: #B8D0E8; }
    .store-row.no-link { cursor: default; }
    .store-row.no-link:hover { box-shadow: var(--shadow); border-color: var(--border); }

    /* Status strip — colored left border encodes status at a glance */
    .strip { width: 4px; align-self: stretch; flex-shrink: 0; }
    .strip-active   { background: #2E7D5B; }
    .strip-trialing { background: #2563EB; }
    .strip-past_due { background: #DC2626; }
    .strip-inactive { background: #C8D8E4; }

    /* Store identity */
    .store-main { flex: 1; padding: 16px 20px; min-width: 0; }
    .store-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .store-addr { font-size: 13px; color: #778899; margin-top: 3px; }

    /* Badges */
    .store-badges {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 16px 16px 16px 0;
      flex-shrink: 0;
    }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }
    .badge-active   { background: #E8F5EE; color: #1A5C3A; }
    .badge-trialing { background: #EFF6FF; color: #1D4ED8; }
    .badge-past_due { background: #FFF5F5; color: #B91C1C; }
    .badge-inactive { background: var(--light-gray); color: #556070; }
    .badge-role     { background: none; border: 1px solid var(--border); color: #778899; font-weight: 600; }

    /* Renewal info */
    .store-renews { padding: 16px 20px 16px 0; flex-shrink: 0; min-width: 148px; }
    .renews-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #778899;
      margin-bottom: 4px;
    }
    .renews-date    { font-size: 13px; font-weight: 600; color: var(--navy); }
    .renews-billing { font-size: 12px; color: #778899; margin-top: 2px; }

    /* CTA */
    .store-cta { padding: 16px 20px 16px 0; flex-shrink: 0; }
    .btn-reports {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--green);
      background: #E8F5EE;
      padding: 8px 14px;
      border-radius: 7px;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.12s;
    }
    .btn-reports:hover { background: #d0ead9; }
    .btn-upgrade {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: #B45309;
      background: #FFFBEB;
      padding: 8px 14px;
      border-radius: 7px;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.12s;
    }
    .btn-upgrade:hover { background: #FEF3C7; }

    /* Add store row */
    .add-row {
      background: none;
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 24px;
      cursor: pointer;
      text-decoration: none;
      color: #778899;
      font-size: 14px;
      font-weight: 600;
      transition: border-color 0.15s, color 0.15s;
      margin-top: 4px;
    }
    .add-row:hover { border-color: var(--green); color: var(--green); }
    .add-row-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
      line-height: 1;
    }

    /* Empty / loading */
    .state-msg { text-align: center; padding: 56px 0; }
    .state-msg h3 { font-size: 20px; color: var(--navy); margin-bottom: 8px; }
    .state-msg p  { color: #778899; font-size: 15px; }

    @media (max-width: 640px) {
      .page-header { flex-direction: column; align-items: flex-start; }
      .store-renews { display: none; }
      .store-badges { padding-right: 12px; }
      .store-cta { padding: 0 14px 14px 24px; }
      .store-row { flex-wrap: wrap; }
      .store-main { padding-bottom: 12px; }
    }
  </style>
</head>
<body>

  <nav class="site-nav" id="site-nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo"><img src="/logo.png" alt="Lottery Track logo">Lottery <span>Track</span></a>
      <div class="nav-user-area">
        <span class="nav-user-email" id="nav-email"></span>
        <button class="btn-signout" id="signout-btn">Sign Out</button>
      </div>
    </div>
  </nav>

  <div class="portal-content">
    <div class="container">
      <div class="page-header">
        <div>
          <div class="page-title">My Stores</div>
          <div class="page-count" id="store-count">Loading…</div>
        </div>
        <a href="add-store.html" class="btn-add" id="add-btn" style="display:none">+ Add Store</a>
      </div>
      <div class="store-list" id="stores-grid">
        <div class="state-msg"><p>Loading your stores…</p></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const { createClient } = window.supabase;
    const db = createClient(
      'https://cduqnevftyibfqtwnffa.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkdXFuZXZmdHlpYmZxdHduZmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxOTMzNjgsImV4cCI6MjA5Nzc2OTM2OH0.TFtvsTN-CzpaDjD8uWRda74WNvbKMAhDHVw5JJYUFfM'
    );

    const STATE_NAMES = { NY: 'New York', TX: 'Texas' };

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtDate(iso) {
      if (!iso) return null;
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderCard(store, role) {
      // store_subscriptions on prod has a UNIQUE(store_id) constraint so PostgREST
      // may embed it as a single object or as an array depending on the version —
      // handle both defensively.
      const subRaw = store.store_subscriptions;
      const sub = Array.isArray(subRaw) ? (subRaw[0] || {}) : (subRaw || {});
      // stripe_status mirrors the raw Stripe value; sub.status maps past_due → active
      // for app-gate purposes, so use stripe_status for accurate portal display.
      // App-started trials are stored as 'trial' (this app's own convention, set by
      // the DB trigger/RPC) — normalize to 'trialing' so the display logic below,
      // written for Stripe's vocabulary, treats both the same.
      const rawStatus = sub.stripe_status || sub.status || 'inactive';
      const status = rawStatus === 'trial' ? 'trialing' : rawStatus;
      const isTrialing = status === 'trialing';
      const isStripe   = sub.payment_provider === 'stripe';

      // Normalize status for CSS classes — only these four are styled
      const statusCls = ['active', 'trialing', 'past_due'].includes(status) ? status : 'inactive';

      const statusLabel = {
        active:   'Active',
        trialing: 'Free Trial',
        past_due: 'Payment Due',
        canceled: 'Cancelled',
        expired:  'Expired',
      }[status] || 'Inactive';

      const renewLabel = status === 'trialing' ? 'Trial ends'
        : status === 'past_due'               ? 'Overdue since'
        : 'Renews';

      const providerStr = sub.payment_provider === 'apple'  ? '🍎 App Store'
        : sub.payment_provider === 'stripe'                 ? '💳 Stripe'
        : sub.payment_provider === 'manual'                 ? 'Manual'
        : '';

      const locationParts = [store.address, STATE_NAMES[store.state] || store.state].filter(Boolean);
      const roleLabel = !role || role === 'owner' ? 'Owner'
        : role.charAt(0).toUpperCase() + role.slice(1);

      // Expired/inactive owned stores show a Subscribe CTA inside the card,
      // so the card must be a div (can't nest <a> inside <a>).
      // Only use a div when there's a Stripe CTA that needs its own link;
      // Apple-billed / app-created stores navigate via the card itself.
      const isExpiredOwned = statusCls === 'inactive' && role === 'owner';
      const useDiv   = (isTrialing && isStripe) || (isExpiredOwned && isStripe);
      const cardTag  = useDiv ? 'div' : 'a';
      const cardHref = useDiv ? '' : `href="store.html?id=${esc(store.id)}"`;
      const cardData = useDiv ? `data-href="store.html?id=${esc(store.id)}"` : '';
      const cardCls  = useDiv ? 'store-row no-link' : 'store-row';

      return `
        <${cardTag} class="${cardCls}" ${cardHref} ${cardData}>
          <div class="strip strip-${statusCls}"></div>
          <div class="store-main">
            <div class="store-name">${esc(store.name)}</div>
            <div class="store-addr">${esc(locationParts.join(' · '))}</div>
          </div>
          <div class="store-badges">
            <span class="badge badge-${statusCls}">${statusLabel}</span>
            <span class="badge badge-role">${roleLabel}</span>
          </div>
          <div class="store-renews">
            <div class="renews-label">${sub.current_period_end ? renewLabel : 'Billing'}</div>
            <div class="renews-date">${sub.current_period_end ? fmtDate(sub.current_period_end) : '<span style="font-weight:400;color:#778899">—</span>'}</div>
            ${providerStr ? `<div class="renews-billing">${providerStr}</div>` : ''}
          </div>
          <div class="store-cta">
            ${(isTrialing && isStripe)
              ? `<a href="upgrade.html?id=${esc(store.id)}" class="btn-upgrade">Upgrade →</a>`
              : (isExpiredOwned && isStripe)
              ? `<a href="upgrade.html?id=${esc(store.id)}" class="btn-upgrade">Subscribe →</a>`
              : `<span class="btn-reports">View Reports →</span>`
            }
          </div>
        </${cardTag}>
      `;
    }

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.replace('index.html'); return; }

      const user = session.user;
      document.getElementById('nav-email').textContent = user.email;
      document.getElementById('signout-btn').addEventListener('click', async () => {
        await db.auth.signOut();
        window.location.replace('index.html');
      });

      // No .eq('admin_id', ...) here on purpose — RLS returns every store this
      // user can see (owned outright, or granted via store_access as admin/viewer).
      const [{ data: stores, error }, { data: accessRows }] = await Promise.all([
        db
          .from('stores')
          .select('id, name, address, state, admin_id, store_subscriptions(status, payment_provider, current_period_end)')
          .order('created_at'),
        db
          .from('store_access')
          .select('store_id, role')
          .eq('user_id', user.id),
      ]);

      const roleByStore = new Map((accessRows || []).map(r => [r.store_id, r.role]));

      const grid = document.getElementById('stores-grid');

      if (error || !stores || stores.length === 0) {
        document.getElementById('store-count').textContent = 'No stores yet';
        grid.innerHTML = `
          <div class="state-msg">
            <h3>No stores yet</h3>
            <p style="margin-bottom:24px">Add your first store to get started.</p>
            <a href="add-store.html" class="btn-primary">Add Your First Store</a>
          </div>`;
        return;
      }

      const n = stores.length;
      document.getElementById('store-count').textContent = `${n} store${n !== 1 ? 's' : ''} you have access to`;
      document.getElementById('add-btn').style.display = '';

      // Split into owned stores and invited stores for separate sections.
      // Use admin_id as the definitive ownership check — a stale store_access row
      // (e.g. from a test invite) must never override the fact that this user owns the store.
      const owned   = stores.filter(s => s.admin_id === user.id);
      const invited = stores.filter(s => s.admin_id !== user.id);

      let html = '';
      if (owned.length) {
        if (invited.length) html += `<div class="list-section-label">Your stores</div>`;
        html += owned.map(s => renderCard(s, 'owner')).join('');
      }
      if (invited.length) {
        html += `<div class="list-section-label">Stores you're invited to</div>`;
        html += invited.map(s => renderCard(s, roleByStore.get(s.id) || 'member')).join('');
      }
      html += `
        <a href="add-store.html" class="add-row">
          <div class="add-row-icon">+</div>
          Add Another Store
        </a>`;

      grid.innerHTML = html;

      // Trialing cards are <div>s — route card-level clicks to store.html,
      // but let nested <a> links (upgrade) handle themselves
      document.querySelectorAll('.store-row[data-href]').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          window.location.href = card.dataset.href;
        });
      });
    }

    init();

    window.addEventListener('scroll', () => {
      document.getElementById('site-nav').classList.toggle('scrolled', window.scrollY > 0);
    });
  </script>

</body>
</html>
