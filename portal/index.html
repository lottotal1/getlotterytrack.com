<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Lottery Track Portal</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <style>
    .portal-wrap {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .auth-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hover);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .auth-eyebrow {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      text-align: center;
      margin-bottom: 8px;
    }
    .auth-card h1 {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }
    .error-box {
      background: #FFF5F5;
      border: 1px solid #FFCCCC;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 14px;
      color: #B91C1C;
      margin-bottom: 20px;
      display: none;
    }
    .error-box.visible { display: block; }
    .auth-submit {
      width: 100%;
      padding: 14px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.2s;
      margin-top: 8px;
    }
    .auth-submit:hover { background: #253648; }
    .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-footer-note {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-top: 24px;
      line-height: 1.6;
    }
    .auth-footer-note a { color: var(--green); }
    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <nav class="site-nav" id="site-nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Lottery <span>Track</span></a>
      <div class="nav-links">
        <a href="../index.html" style="color:var(--light);text-decoration:none;font-size:14px;font-weight:500;padding:8px 12px;border-radius:6px;transition:background 0.2s" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='transparent'">← Back to site</a>
      </div>
    </div>
  </nav>

  <div class="portal-wrap">
    <div class="auth-card">
      <span class="auth-eyebrow">Owner Portal</span>
      <h1>Sign in to your account</h1>

      <div class="error-box" id="error-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-submit" id="submit-btn">Sign In</button>
      </form>

      <p class="auth-footer-note">
        Don't have an account? <a href="https://apps.apple.com/app/id6783105590">Download the iPhone app</a> to get started.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const { createClient } = window.supabase;
    const db = createClient(
      'https://cduqnevftyibfqtwnffa.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkdXFuZXZmdHlpYmZxdHduZmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxOTMzNjgsImV4cCI6MjA5Nzc2OTM2OH0.TFtvsTN-CzpaDjD8uWRda74WNvbKMAhDHVw5JJYUFfM'
    );

    // Already signed in → go straight to dashboard
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.replace('dashboard.html');
    });

    const form     = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const btn      = document.getElementById('submit-btn');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });

      if (error) {
        showError(
          error.message === 'Invalid login credentials'
            ? 'Incorrect email or password. Please try again.'
            : error.message
        );
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      window.location.replace('dashboard.html');
    });

    window.addEventListener('scroll', () => {
      document.getElementById('site-nav').classList.toggle('scrolled', window.scrollY > 0);
    });
  </script>

</body>
</html>
