<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Lottery Track Portal</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <style>
    .portal-wrap {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .auth-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hover);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .auth-eyebrow {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      text-align: center;
      margin-bottom: 8px;
    }
    .auth-card h1 {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }
    .error-box {
      background: #FFF5F5;
      border: 1px solid #FFCCCC;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 14px;
      color: #B91C1C;
      margin-bottom: 20px;
      display: none;
    }
    .error-box.visible { display: block; }
    .auth-submit {
      width: 100%;
      padding: 14px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.2s;
      margin-top: 8px;
    }
    .auth-submit:hover { background: #253648; }
    .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-footer-note {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-top: 24px;
      line-height: 1.6;
    }
    .auth-footer-note a { color: var(--green); }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: -12px;
      margin-bottom: 18px;
    }
    .result-icon {
      width: 72px;
      height: 72px;
      background: #E8F5EE;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 24px;
      color: var(--green);
      font-weight: 700;
    }
    .resend-btn {
      background: none;
      border: none;
      color: var(--green);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-sans);
      padding: 0;
      text-decoration: underline;
    }
    .resend-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <nav class="site-nav" id="site-nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo"><img src="/logo.png" alt="Lottery Track logo">Lottery <span>Track</span></a>
      <div class="nav-links">
        <a href="../index.html" style="color:var(--light);text-decoration:none;font-size:14px;font-weight:500;padding:8px 12px;border-radius:6px;transition:background 0.2s" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='transparent'">← Back to site</a>
      </div>
    </div>
  </nav>

  <div class="portal-wrap">
    <div class="auth-card" id="signup-view">
      <span class="auth-eyebrow">Owner Portal</span>
      <h1>Create your account</h1>

      <div class="error-box" id="error-box"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" placeholder="Your name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 8 characters" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter your password" required autocomplete="new-password">
        </div>
        <button type="submit" class="auth-submit" id="submit-btn">Create Account</button>
      </form>

      <p class="auth-footer-note">
        Already have an account? <a href="index.html">Sign in</a>
      </p>
    </div>

    <div class="auth-card" id="sent-view" style="display:none;text-align:center">
      <div class="result-icon">✓</div>
      <h1 style="margin-bottom:12px">Check your email</h1>
      <p style="font-size:15px;color:#556070;line-height:1.7;margin-bottom:24px">
        We sent a confirmation link to <strong id="sent-email"></strong>. Click it to activate your
        account, then you'll be able to add your first store.
      </p>
      <p style="font-size:13px;color:#888">
        Didn't get it? <button type="button" class="resend-btn" id="resend-btn">Resend email</button>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const { createClient } = window.supabase;
    const db = createClient(
      'https://cduqnevftyibfqtwnffa.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkdXFuZXZmdHlpYmZxdHduZmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxOTMzNjgsImV4cCI6MjA5Nzc2OTM2OH0.TFtvsTN-CzpaDjD8uWRda74WNvbKMAhDHVw5JJYUFfM'
    );

    // Already signed in → go straight to dashboard
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.replace('dashboard.html');
    });

    const form       = document.getElementById('signup-form');
    const errorBox   = document.getElementById('error-box');
    const btn        = document.getElementById('submit-btn');
    const signupView = document.getElementById('signup-view');
    const sentView   = document.getElementById('sent-view');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');

      const fullName        = document.getElementById('full-name').value.trim();
      const email            = document.getElementById('email').value.trim();
      const password          = document.getElementById('password').value;
      const confirmPassword   = document.getElementById('confirm-password').value;

      if (!fullName || !email || !password) {
        showError('Please fill in your name, email, and password.');
        return;
      }
      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }
      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      // Store the pending profile BEFORE calling signUp — mirrors the iPhone app's
      // registration flow. confirm.html reads this after the email link is clicked
      // to create the profile row via the register-admin edge function.
      localStorage.setItem('pending_profile', JSON.stringify({ fullName }));

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: new URL('confirm.html', window.location.href).toString(),
        },
      });

      // Supabase returns a user with no identities instead of a clear error when
      // the email is already registered — same obfuscated-duplicate behavior the
      // app works around.
      if (!data?.session && data?.user?.identities?.length === 0) {
        showError('An account with this email already exists. Try signing in instead.');
        btn.disabled = false;
        btn.textContent = 'Create Account';
        return;
      }

      if (error) {
        showError(error.message);
        btn.disabled = false;
        btn.textContent = 'Create Account';
        return;
      }

      sessionStorage.setItem('pending_email', email);
      document.getElementById('sent-email').textContent = email;
      signupView.style.display = 'none';
      sentView.style.display = 'block';
    });

    document.getElementById('resend-btn').addEventListener('click', async () => {
      const email = sessionStorage.getItem('pending_email');
      if (!email) return;
      const resendBtn = document.getElementById('resend-btn');
      resendBtn.disabled = true;
      resendBtn.textContent = 'Sending…';
      await db.auth.resend({ type: 'signup', email });
      resendBtn.textContent = 'Sent!';
      setTimeout(() => {
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend email';
      }, 5000);
    });

    window.addEventListener('scroll', () => {
      document.getElementById('site-nav').classList.toggle('scrolled', window.scrollY > 0);
    });
  </script>

</body>
</html>
