<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upgrade to Paid — Lottery Track Portal</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <style>
    .portal-topbar {
      background: var(--navy);
      padding: 18px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .topbar-inner {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-link {
      color: var(--light);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .back-link:hover { color: white; }
    .topbar-title { font-size: 17px; font-weight: 700; color: white; }

    .form-wrap { padding: 48px 0 80px; }
    .form-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 40px;
      max-width: 560px;
      margin: 0 auto;
    }
    .store-label {
      font-size: 13px;
      font-weight: 700;
      color: #778899;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .store-name-display {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 12px;
    }

    .plan-row { display: flex; gap: 12px; margin-bottom: 24px; }
    .plan-btn {
      flex: 1;
      padding: 20px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      background: white;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .plan-btn:hover { border-color: var(--green); }
    .plan-btn.on { border-color: var(--green); background: #F0FBF5; }
    .plan-name {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
      margin-bottom: 8px;
    }
    .plan-btn.on .plan-name { color: var(--green); }
    .plan-price {
      display: block;
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1;
    }
    .plan-per { display: block; font-size: 12px; color: #888; margin-top: 5px; }
    .plan-save {
      position: absolute;
      top: -10px;
      right: 12px;
      background: #F59E0B;
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .trial-note {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 13px;
      color: #1D4ED8;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .error-box {
      background: #FFF5F5;
      border: 1px solid #FFCCCC;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 14px;
      color: #B91C1C;
      margin-bottom: 20px;
      display: none;
    }
    .error-box.visible { display: block; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.2s;
      margin-top: 4px;
    }
    .submit-btn:hover { background: #256b4e; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .stripe-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 16px;
      font-size: 13px;
      color: #778899;
      background: var(--light-gray);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      line-height: 1.6;
    }

    .nav-user-area { display: flex; align-items: center; gap: 10px; }
    .nav-user-email { font-size: 13px; color: var(--light); }
    .btn-signout {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--light);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.2s;
    }
    .btn-signout:hover { background: rgba(255,255,255,0.1); color: white; }

    @media (max-width: 680px) {
      .form-card { padding: 28px 20px; }
      .plan-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav class="site-nav" id="site-nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Lottery <span>Track</span></a>
      <div class="nav-user-area">
        <span class="nav-user-email" id="nav-email"></span>
        <button class="btn-signout" id="signout-btn">Sign Out</button>
      </div>
    </div>
  </nav>

  <div class="portal-topbar">
    <div class="topbar-inner">
      <a href="dashboard.html" class="back-link">← My Stores</a>
      <span style="color:rgba(255,255,255,0.3)">|</span>
      <span class="topbar-title" id="topbar-name">Upgrade Store</span>
    </div>
  </div>

  <div class="form-wrap">
    <div class="container">
      <div class="form-card" id="form-card">
        <div style="text-align:center;padding:40px 0;color:#778899">Loading…</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const { createClient } = window.supabase;
    const db = createClient(
      'https://fnnuakksfrurmjcjikib.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZubnVha2tzZnJ1cm1qY2ppa2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2Nzc4MzEsImV4cCI6MjA4ODI1MzgzMX0.qSxliArHcEEuHVShVvpskPNybewfuCaRm0VpshiN8Ps'
    );
    const EDGE_URL = 'https://fnnuakksfrurmjcjikib.supabase.co/functions/v1/create-checkout-session';

    const params  = new URLSearchParams(window.location.search);
    const storeId = params.get('id');
    if (!storeId) window.location.replace('dashboard.html');

    let selectedPrice = 'price_1TWP8nFzKa8sgcoPtUJfhhcZ'; // monthly default
    let userSession   = null;

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.replace('index.html'); return; }
      userSession = session;

      document.getElementById('nav-email').textContent = session.user.email;
      document.getElementById('signout-btn').addEventListener('click', async () => {
        await db.auth.signOut();
        window.location.replace('index.html');
      });

      const { data: store, error } = await db
        .from('stores')
        .select('id, name, store_subscriptions(status)')
        .eq('id', storeId)
        .single();

      if (error || !store) {
        window.location.replace('dashboard.html');
        return;
      }

      const sub = store.store_subscriptions || {};
      // App-started trials are stored as 'trial' (this app's own DB convention);
      // 'trialing' would only ever appear for a Stripe-native trial, which this
      // app doesn't use. Accept both so the gate actually matches real data.
      if (sub.status !== 'trialing' && sub.status !== 'trial') {
        window.location.replace(`store.html?id=${esc(storeId)}`);
        return;
      }

      document.getElementById('topbar-name').textContent = store.name;

      document.getElementById('form-card').innerHTML = `
        <div class="store-label">Upgrading store</div>
        <div class="store-name-display">${esc(store.name)}</div>

        <div class="trial-note">
          Your store is currently on a free trial. Choose a plan to activate your subscription — your data and settings are untouched.
        </div>

        <div class="section-label">Choose a plan</div>
        <div class="plan-row">
          <div class="plan-btn on" data-price="price_1TWP8nFzKa8sgcoPtUJfhhcZ" id="plan-monthly">
            <span class="plan-name">Monthly</span>
            <span class="plan-price">$14.99</span>
            <span class="plan-per">per month</span>
          </div>
          <div class="plan-btn" data-price="price_1TWP9qFzKa8sgcoPaCK4RyTy" id="plan-annual">
            <div class="plan-save">Save 17%</div>
            <span class="plan-name">Annual</span>
            <span class="plan-price">$149.99</span>
            <span class="plan-per">per year (~$12.50/mo)</span>
          </div>
        </div>

        <div class="error-box" id="error-box"></div>

        <button class="submit-btn" id="submit-btn">Continue to Secure Payment →</button>

        <div class="stripe-note">
          <span style="flex-shrink:0;font-size:16px">🔒</span>
          <span>Payment is processed securely by Stripe. You can cancel your subscription at any time.</span>
        </div>
      `;

      document.querySelectorAll('.plan-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.plan-btn').forEach(b => b.classList.remove('on'));
          btn.classList.add('on');
          selectedPrice = btn.dataset.price;
        });
      });

      document.getElementById('submit-btn').addEventListener('click', async () => {
        const errorBox = document.getElementById('error-box');
        const btn      = document.getElementById('submit-btn');
        errorBox.classList.remove('visible');
        btn.disabled    = true;
        btn.textContent = 'Redirecting to checkout…';

        try {
          const res = await fetch(EDGE_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${userSession.access_token}`,
            },
            body: JSON.stringify({
              priceId:  selectedPrice,
              channel:  'web',
              store_id: storeId,
            }),
          });

          const result = await res.json();
          if (!res.ok || result.error) throw new Error(result.error || 'Checkout session failed.');

          window.location.href = result.url;
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.add('visible');
          btn.disabled    = false;
          btn.textContent = 'Continue to Secure Payment →';
        }
      });
    }

    init();

    window.addEventListener('scroll', () => {
      document.getElementById('site-nav').classList.toggle('scrolled', window.scrollY > 0);
    });
  </script>

</body>
</html>
